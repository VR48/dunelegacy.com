# Included only inside the dunelegacy.com TLS virtual host.
# The pinned SDK defaults to wss://<page host>/; HTTP / remains the website.
ProxyPreserveHost On
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{REQUEST_URI} ^/$
RewriteRule ^/?$ ws://127.0.0.1:8788/ [P,L]
ProxyPass "/matchmaking" "ws://127.0.0.1:8788/" retry=0 timeout=60
