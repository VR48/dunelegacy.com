name: Update DuneCity Download Counts
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: download-statistics
  cancel-in-progress: false
jobs:
  update-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and collect download statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/update-download-stats.py
      - name: Commit snapshot and publish website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email 'ci@dunelegacy.com'
          git config user.name 'DuneCity CI'
          git add analytics/download-state.json website/data/download-stats.json
          git commit -m 'chore: refresh hourly download statistics'
          git pull --rebase origin main
          git push origin HEAD:main
          # GITHUB_TOKEN pushes do not trigger another workflow automatically.
          gh workflow run deploy-metaserver-droplet.yml --ref main
