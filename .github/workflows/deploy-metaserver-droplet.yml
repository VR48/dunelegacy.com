name: Deploy to Droplet

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'metaserver/**'
      - 'p2p-service/**'
      - 'p2p-preview/**'
      - 'matchmaking-service/**'
      - 'deploy/**'
      - '.github/workflows/deploy-metaserver-droplet.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional exact full website SHA to resume; empty uses this run commit, never a later main.'
        type: string
        default: ''
      channel:
        description: 'Auto detects staging-only pushes; site also deploys services and stable website.'
        type: choice
        options: [auto, site, staging]
        default: auto

permissions:
  contents: read

concurrency:
  group: dunelegacy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Freeze source and isolate staging-only publications
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_CHANNEL: ${{ inputs.channel || 'auto' }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SHA" ] && ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Recovery source_sha must be a full 40-character commit'
            exit 1
          fi
          DEPLOY_SHA=$(git rev-parse HEAD)
          # Validate history before executing any script from a manually selected
          # checkout or admitting it to a job which can read deployment secrets.
          RELATION=$(gh api "repos/$GITHUB_REPOSITORY/compare/${DEPLOY_SHA}...main" --jq .status)
          if [ "$RELATION" != ahead ] && [ "$RELATION" != identical ]; then
            echo '::error::Deployment source must be in trusted website main history'
            exit 1
          fi
          DEPLOY_CHANNEL="$REQUESTED_CHANNEL"
          if [ "$DEPLOY_CHANNEL" = auto ]; then
            DEPLOY_CHANNEL=site
            if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
              mapfile -t CHANGED < <(git diff --name-only "$BEFORE_SHA" "$DEPLOY_SHA")
              STAGING_ONLY=true
              for path in "${CHANGED[@]}"; do
                [[ "$path" = website/play-staging/* ]] || STAGING_ONLY=false
              done
              if [ "${#CHANGED[@]}" -gt 0 ] && [ "$STAGING_ONLY" = true ]; then DEPLOY_CHANNEL=staging; fi
            fi
          fi
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "DEPLOY_CHANNEL=$DEPLOY_CHANNEL" >> "$GITHUB_ENV"
          export DEPLOY_SHA DEPLOY_CHANNEL
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          channels = ['play-staging'] if os.environ['DEPLOY_CHANNEL'] == 'staging' else ['play', 'play-staging']
          record = dict(websiteSourceCommit=os.environ['DEPLOY_SHA'], channel=os.environ['DEPLOY_CHANNEL'],
                        runId=os.environ['GITHUB_RUN_ID'], runAttempt=os.environ['GITHUB_RUN_ATTEMPT'], browsers={})
          for channel in channels:
              manifest = Path('website') / channel / 'build.json'
              if manifest.exists():
                  record['browsers'][channel] = json.loads(manifest.read_text())
          (Path(os.environ['RUNNER_TEMP']) / 'deployment-inputs.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Persist frozen deployment/recovery inputs
        uses: actions/upload-artifact@v4
        with:
          name: Website-deployment-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-inputs.json
          if-no-files-found: error
          retention-days: 90

      - name: Validate browser security policy
        run: |
          python3 deploy/check-web-security.py
          if [ -f website/play-staging/build.json ]; then python3 deploy/check-web-security.py --play-root website/play-staging; fi
          python3 deploy/test-web-sync.py
          python3 deploy/test-play-transfer.py
          python3 deploy/test-play-parts.py

      - name: Validate metaserver PHP
        run: |
          php -l metaserver/metaserver.php
          php -l metaserver/analytics.php
          php -l metaserver/usage.php
          python3 -m unittest discover -s scripts/tests -p 'test_usage_stats.py'
          php -l metaserver/feedback.php
          php -l metaserver/feedback_service.php
          php -l metaserver/feedback_storage.php
          python3 -m py_compile metaserver/feedback_store.py
          php scripts/tests/test_feedback.php
          python3 -m py_compile metaserver/analytics_store.py
          php -l website/p2p/index.php
          php -l metaserver/public_activity.php
          python3 scripts/tests/test_public_activity.py
          php -l metaserver/p2p_notifications.php
          php scripts/tests/test_p2p_notifications.php
          python3 deploy/install-p2p-service.py --source p2p-service --target "$RUNNER_TEMP/p2p-install-check"
          python3 deploy/test-p2p-install.py
          python3 deploy/test-release-preview.py
          php -l deploy/p2p-preview-entry.php
          if [ -f deploy/release-preview.json ]; then
            python3 deploy/install-release-preview.py --repository . --website website --validate-only
            python3 deploy/install-p2p-service.py --source p2p-preview --target "$RUNNER_TEMP/preview-install-check"
          fi
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test compressed download progress
        run: node --test deploy/test-loading-progress.mjs
      - name: Join selected browser channels
        run: |
          if [ "$DEPLOY_CHANNEL" != staging ]; then python3 deploy/play_parts.py website/play --keep-parts; fi
          if [ -f website/play-staging/build.json ]; then python3 deploy/play_parts.py website/play-staging --keep-parts; fi
      - name: Restore stable compressed browser files
        if: env.DEPLOY_CHANNEL != 'staging'
        id: play-transfer-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/play-transfer/play
          key: play-brotli-v2-${{ runner.os }}-${{ hashFiles('website/play/build.json', 'deploy/prepare-play-transfer.mjs') }}
      - name: Restore staging compressed browser files
        if: hashFiles('website/play-staging/build.json') != ''
        id: staging-transfer-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/play-transfer/play-staging
          key: play-staging-brotli-v2-${{ runner.os }}-${{ hashFiles('website/play-staging/build.json', 'deploy/prepare-play-transfer.mjs') }}
      - name: Compress stable browser files only when their bytes change
        if: env.DEPLOY_CHANNEL != 'staging' && steps.play-transfer-cache.outputs.cache-hit != 'true'
        run: node deploy/prepare-play-transfer.mjs website/play "$RUNNER_TEMP/play-transfer/play"
      - name: Compress staging browser files in an independent cache
        if: hashFiles('website/play-staging/build.json') != '' && steps.staging-transfer-cache.outputs.cache-hit != 'true'
        run: node deploy/prepare-play-transfer.mjs website/play-staging "$RUNNER_TEMP/play-transfer/play-staging"
      - name: Test matchmaking service
        run: |
          npm ci --prefix matchmaking-service --ignore-scripts
          npm test --prefix matchmaking-service

      - name: Configure verified SSH transport
        env:
          DROPLET_IP: ${{ secrets.METASERVER_DROPLET_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.METASERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DROPLET_IP" ]; then
            echo "::error::Missing METASERVER_DROPLET_IP repository secret."
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing DROPLET_SSH_KEY repository secret."
            exit 1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing METASERVER_SSH_KNOWN_HOSTS repository secret."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub
          ssh-keygen -F "$DROPLET_IP" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::Pinned known_hosts does not contain the deployment host."
            exit 1
          }

      - name: Bootstrap restricted deployment account when needed
        env:
          DROPLET_IP: ${{ secrets.METASERVER_DROPLET_IP }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          if ssh "${SSH_ARGS[@]}" dunelegacy-deploy@"$DROPLET_IP" true 2>/dev/null; then
            exit 0
          fi

          echo "Configuring the restricted deployment account and runtime dependencies..."
          scp "${SSH_ARGS[@]}" deploy/bootstrap-secure-deploy.sh /tmp/deploy_key.pub root@"$DROPLET_IP":/root/
          ssh "${SSH_ARGS[@]}" root@"$DROPLET_IP" \
            'bash /root/bootstrap-secure-deploy.sh dunelegacy-deploy /root/deploy_key.pub'
          ssh "${SSH_ARGS[@]}" dunelegacy-deploy@"$DROPLET_IP" true

      - name: Deploy website and metaserver
        env:
          DROPLET_IP: ${{ secrets.METASERVER_DROPLET_IP }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${SSH_ARGS[@]}" deploy/deploy-release.sh \
            dunelegacy-deploy@"$DROPLET_IP":/home/dunelegacy-deploy/deploy-release.sh
          printf -v REMOTE_COMMAND 'bash -s -- %q %q %q %q' \
            "$DEPLOY_SHA" "$DEPLOY_CHANNEL" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          ssh "${SSH_ARGS[@]}" dunelegacy-deploy@"$DROPLET_IP" "$REMOTE_COMMAND" <<'PREPARE_TRANSFER'
          set -euo pipefail
          mkdir -p "$HOME/play-transfer-$1-$3-$4"
          PREPARE_TRANSFER
          scp -r "${SSH_ARGS[@]}" "$RUNNER_TEMP/play-transfer/." \
            "dunelegacy-deploy@$DROPLET_IP:play-transfer-$DEPLOY_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/"
          ssh "${SSH_ARGS[@]}" dunelegacy-deploy@"$DROPLET_IP" "$REMOTE_COMMAND" <<'DEPLOY_FROZEN'
          set -euo pipefail
          transfer_root="$HOME/play-transfer-$1-$3-$4"
          trap 'rm -rf -- "$transfer_root"' EXIT
          PLAY_TRANSFER_ROOT="$transfer_root" DEPLOY_REVISION="$1" DEPLOY_CHANNEL="$2" DEPLOY_RUN_ID="$3" \
            bash /home/dunelegacy-deploy/deploy-release.sh
          DEPLOY_FROZEN

          if [ "$DEPLOY_CHANNEL" != staging ] && [ -n "$FEEDBACK_GITHUB_TOKEN" ]; then
            printf '%s' "$FEEDBACK_GITHUB_TOKEN" \
              | ssh "${SSH_ARGS[@]}" dunelegacy-deploy@"$DROPLET_IP" \
                  'umask 027; token_file=$(mktemp /var/www/data/.feedback-token.XXXXXX); cat > "$token_file"; chmod 0640 "$token_file"; mv -f "$token_file" /var/www/data/feedback_github_token.txt'
          fi

          if [ "$DEPLOY_CHANNEL" != staging ] && [ -n "$DISCORD_WEBHOOK_URL" ]; then
            printf '%s' "$DISCORD_WEBHOOK_URL" \
              | ssh "${SSH_ARGS[@]}" dunelegacy-deploy@"$DROPLET_IP" \
                  'umask 027; cat > /var/www/data/discord_webhook.txt'
          fi

      - name: Verify production security headers
        run: |
          set -euo pipefail
          # Exercises the Apache storage backend without creating an issue.
          test "$(curl --fail --silent --show-error --data '' https://dunelegacy.com/metaserver/feedback.php)" = \
            'ERROR Invalid feedback. Please check the text and try again.'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --data 'command=gamestats&phase=health' \
            https://dunelegacy.com/metaserver/metaserver.php \
            | grep -qx 'OK'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --dump-header /tmp/play-headers --output /dev/null https://dunelegacy.com/play/
          grep -qi '^strict-transport-security: max-age=' /tmp/play-headers
          grep -qi '^content-security-policy:.*default-src.*none' /tmp/play-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/play-headers
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/play-headers
          if grep -Eqi '^server:.*Apache/[0-9]' /tmp/play-headers; then
            echo "::warning::The server is exposing its exact Apache version; finish the documented administrator-only Apache hardening step."
          fi
          curl --fail --silent --show-error --head https://dunelegacy.com/play/dunecity.wasm \
            | grep -qi '^content-type: application/wasm'
          for asset in dunecity.wasm dunecity.data; do
            curl --fail --silent --show-error --head -H 'Accept-Encoding: br' \
              "https://dunelegacy.com/play/$asset" > /tmp/play-transfer-headers
            grep -qi '^content-encoding: br' /tmp/play-transfer-headers
            grep -qi '^vary:.*Accept-Encoding' /tmp/play-transfer-headers
            grep -qi '^content-length:' /tmp/play-transfer-headers
          done

      - name: Verify observed browser versions and advertised hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          expected = json.loads((Path(os.environ['RUNNER_TEMP']) / 'deployment-inputs.json').read_text())
          observed = {}
          for channel, desired in expected['browsers'].items():
              origin = 'https://dunelegacy.com/' + channel
              with urllib.request.urlopen(origin + '/build.json', timeout=60) as response:
                  actual = json.load(response)
              observed[channel] = actual
              (Path(os.environ['RUNNER_TEMP']) / 'observed-live.json').write_text(json.dumps(observed, indent=2) + '\n')
              if (actual['version'], actual['sourceCommit']) != (desired['version'], desired['sourceCommit']):
                  raise SystemExit(f'{channel}: desired {desired["version"]}/{desired["sourceCommit"]}, observed {actual["version"]}/{actual["sourceCommit"]}')
              for name, digest in desired['sha256'].items():
                  if name != 'index.html' and actual['sha256'].get(name) != digest:
                      raise SystemExit(f'{channel}: deployed runtime differs from frozen source: {name}')
              for name, digest in actual['sha256'].items():
                  if Path(name).name != name:
                      raise SystemExit('Unsafe live browser artifact name')
                  checksum = hashlib.sha256()
                  with urllib.request.urlopen(origin + '/' + name, timeout=180) as response:
                      for chunk in iter(lambda: response.read(1024 * 1024), b''):
                          checksum.update(chunk)
                  if checksum.hexdigest() != digest:
                      raise SystemExit(f'{channel}: live artifact hash mismatch: {name}')
              print(f'Observed {channel}: {actual["version"]}/{actual["sourceCommit"]}; runtime hashes verified')
          PY
      - name: Retain desired and observed delivery identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Website-delivery-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/deployment-inputs.json
            ${{ runner.temp }}/observed-live.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove deployment credential
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/deploy_key.pub
