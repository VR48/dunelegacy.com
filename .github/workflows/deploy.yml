name: Deploy to DigitalOcean

# NOTE: Automatic (push) deploys are disabled. The live site dunelegacy.com is
# served by the droplet via deploy-metaserver-droplet.yml ("Deploy to Droplet").
# This DigitalOcean App Platform deploy is legacy and its
# DIGITALOCEAN_ACCESS_TOKEN has expired, so it failed on every push. It is now
# manual-only (workflow_dispatch). To re-enable: renew DIGITALOCEAN_ACCESS_TOKEN
# and restore the `push:` trigger below.
on:
  workflow_dispatch:  # Manual only

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install doctl (DigitalOcean CLI)
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    
    - name: Deploy to DigitalOcean App Platform
      run: |
        # Update the app using doctl
        doctl apps update ${{ secrets.DIGITALOCEAN_APP_ID }} --spec .digitalocean/app.yaml
        
        echo "✅ Deployment initiated!"
        echo "Monitor at: https://cloud.digitalocean.com/apps/${{ secrets.DIGITALOCEAN_APP_ID }}"

