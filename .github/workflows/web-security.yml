name: Web security

on:
  pull_request:
    paths:
      - 'website/.htaccess'
      - 'website/play/**'
      - 'deploy/check-web-security.py'
      - '.github/workflows/web-security.yml'
  push:
    branches: [main]
    paths:
      - 'website/.htaccess'
      - 'website/play/**'
      - 'deploy/check-web-security.py'
      - '.github/workflows/web-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate CSP and artifact integrity
        run: python3 deploy/check-web-security.py
