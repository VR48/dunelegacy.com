name: Web security

on:
  pull_request:
    paths:
      - 'website/.htaccess'
      - 'website/play/**'
      - 'deploy/check-web-security.py'
      - '.github/workflows/web-security.yml'
  push:
    branches: [main]
    paths:
      - 'website/.htaccess'
      - 'website/play/**'
      - 'deploy/check-web-security.py'
      - '.github/workflows/web-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate CSP and artifact integrity
        run: python3 deploy/check-web-security.py
