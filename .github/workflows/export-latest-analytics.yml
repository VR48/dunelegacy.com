name: Export latest analytics

on:
  workflow_dispatch:
    inputs:
      local_public_key:
        description: Public key to authorize on the restricted deployment account
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure verified SSH transport
        env:
          DROPLET_IP: ${{ secrets.METASERVER_DROPLET_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.METASERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -F "$DROPLET_IP" -f ~/.ssh/known_hosts >/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Authorize the dedicated local key
        env:
          DROPLET_IP: ${{ secrets.METASERVER_DROPLET_IP }}
          LOCAL_PUBLIC_KEY: ${{ inputs.local_public_key }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          printf '%s\n' "$LOCAL_PUBLIC_KEY" > /tmp/local-metaserver.pub
          ssh-keygen -lf /tmp/local-metaserver.pub
          scp "${SSH_ARGS[@]}" /tmp/local-metaserver.pub \
            dunelegacy-deploy@"$DROPLET_IP":/home/dunelegacy-deploy/local-metaserver.pub
          ssh "${SSH_ARGS[@]}" dunelegacy-deploy@"$DROPLET_IP" '
            set -e
            auth="$HOME/.ssh/authorized_keys"
            entry="restrict $(cat "$HOME/local-metaserver.pub")"
            grep -Fqx "$entry" "$auth" || printf "%s\n" "$entry" >> "$auth"
            chmod 600 "$auth"
            rm -f "$HOME/local-metaserver.pub"
          '

      - name: Export latest completed match
        env:
          DROPLET_IP: ${{ secrets.METASERVER_DROPLET_IP }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${SSH_ARGS[@]}" deploy/export-latest-analytics.py \
            dunelegacy-deploy@"$DROPLET_IP":/home/dunelegacy-deploy/export-latest-analytics.py
          ssh "${SSH_ARGS[@]}" dunelegacy-deploy@"$DROPLET_IP" \
            'python3 /home/dunelegacy-deploy/export-latest-analytics.py /var/www/data/games.sqlite' \
            > /tmp/latest-match.json
          test -s /tmp/latest-match.json

      - name: Encrypt export
        run: |
          set -euo pipefail
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in /tmp/latest-match.json -out /tmp/latest-match.cms \
            .github/analytics-export-cert.pem

      - name: Upload encrypted export
        uses: actions/upload-artifact@v4
        with:
          name: latest-match-encrypted
          path: /tmp/latest-match.cms
          retention-days: 1
          if-no-files-found: error
